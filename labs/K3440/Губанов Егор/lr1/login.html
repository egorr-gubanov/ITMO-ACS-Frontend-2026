<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Вместе</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container-xl py-3 d-flex justify-content-between gap-3">
    <a class="brand" href="index.html">ВМЕСТЕ</a>
    <nav class="site-nav" aria-label="Основная навигация">
      <a href="index.html">Занятия</a><a href="register.html">Регистрация</a>
    </nav>
  </div>
</header>

<main class="container py-5 auth-wrap">
  <section class="brutal-card p-4 p-md-5">
    <p class="eyebrow">Рады видеть тебя снова</p>
    <h1 class="display-title">Войти</h1>
    <form class="needs-validation mt-4" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Почта</label>
        <input class="form-control" id="loginEmail" type="email" required>
        <div class="invalid-feedback">Введи корректную почту.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Пароль</label>
        <input class="form-control" id="loginPassword" type="password" minlength="6" required>
        <div class="invalid-feedback">Пароль должен быть не короче 6 символов.</div>
      </div>
      <button class="btn btn-brutal btn-clay w-100" type="submit">Войти</button>
      <p class="form-message mt-3" aria-live="polite"></p>
    </form>
    <p class="mt-3 mb-0">Нет аккаунта? <a href="register.html">Создать аккаунт</a></p>
    <p class="eyebrow mt-4 mb-0">Демонстрационная форма: данные не отправляются на сервер.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js" defer></script>
</body>
</html>
