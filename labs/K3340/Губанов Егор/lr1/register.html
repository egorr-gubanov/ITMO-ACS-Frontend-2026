<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Вместе</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container-xl py-3 d-flex justify-content-between gap-3">
    <a class="brand" href="index.html">ВМЕСТЕ</a>
    <nav class="site-nav" aria-label="Основная навигация">
      <a href="index.html">Занятия</a><a href="login.html">Войти</a>
    </nav>
  </div>
</header>

<main class="container py-5 auth-wrap">
  <section class="brutal-card p-4 p-md-5">
    <p class="eyebrow">Двигаться легче вместе</p>
    <h1 class="display-title">Создать аккаунт</h1>
    <form class="needs-validation mt-4" novalidate>
      <div class="mb-3">
        <label class="form-label" for="registerName">Имя</label>
        <input class="form-control" id="registerName" type="text" required>
        <div class="invalid-feedback">Введи имя.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="registerEmail">Почта</label>
        <input class="form-control" id="registerEmail" type="email" required>
        <div class="invalid-feedback">Введи корректную почту.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="registerPassword">Пароль</label>
        <input class="form-control" id="registerPassword" type="password" minlength="6" required>
        <div class="invalid-feedback">Минимум 6 символов.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="goal">Что тебе ближе?</label>
        <select class="form-select" id="goal">
          <option>Пилатес</option><option>Йога</option><option>Растяжка</option>
        </select>
      </div>
      <button class="btn btn-brutal btn-clay w-100" type="submit">
        Зарегистрироваться
      </button>
      <p class="form-message mt-3" aria-live="polite"></p>
    </form>
    <p class="mt-3 mb-0">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    <p class="eyebrow mt-4 mb-0">Демонстрационная форма: данные не отправляются на сервер.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js" defer></script>
</body>
</html>
